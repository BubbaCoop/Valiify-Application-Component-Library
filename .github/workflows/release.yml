# Tag-driven RELEASE VERIFICATION. Publishing is done LOCALLY (decision
# 2026-09-03): npm requires interactive 2FA for this account's writes, so
# CI publish needs the package's npmjs.com "Trusted Publisher" form filled
# in (owner BubbaCoop, repo Valiify-Application-Component-Library, workflow
# release.yml) — until someone does that one-time config, the local ritual
# is the release path:
#
#   # on a green, merged main:
#   <cut CHANGELOG [Unreleased] -> [x.y.z]>; git commit
#   npm version patch                      # bumps + tags
#   npm publish                            # browser 2FA prompt, local only
#   git push origin main --follow-tags     # triggers this verification
#   npm run restore-examples               # undo prepack's example rewrite
#
# This workflow gates every tag: version-match + fast gates + the packaging
# smoke test. TO RE-ENABLE CI PUBLISHING: fill in the Trusted Publisher
# form on npmjs.com, then restore the publish step documented at the bottom
# of this file.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v4

      # NO registry-url here: setup-node's registry-url writes an .npmrc
      # with _authToken=${NODE_AUTH_TOKEN}, which breaks token-less OIDC
      # publishing ("Failed to replace env in config"). Trusted publishing
      # needs a clean npm config.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm

      - run: npm ci

      - name: tag matches package.json version
        run: |
          set -euo pipefail
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json $PKG — bump the version before tagging."
            exit 1
          fi

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      - name: verify:layers
        run: npm run verify:layers

      - name: verify:bundle
        run: npm run verify:bundle

      # Non-blocking for the va- release ONLY, by explicit decision (2026-09-14).
      # The 119 findings are all pre-existing dashboard-era names (.chip, .input,
      # .modal-positive, the .icon family) in six docs that were already wrong before
      # the rename — ZERO are prefix misses. Reconciling them means documenting how
      # icons actually work here, which is a writing task, not rename cleanup, and it
      # does not gate this release.
      #
      # It still RUNS and still reports red in the release log. Remove
      # continue-on-error the moment the drift commit lands — leaving it is how a live
      # gate turns into a permanently ignored one.
      # continue-on-error, NOT `exit 0`: the step must still render RED in the run.
      # Swallowing the exit code would paint it green, which is a worse lie than the
      # collapsed log this replaces. The outputs are written before the real exit code
      # is re-raised, so the summary step below can still read them.
      - name: verify:vocabulary
        id: vocab
        continue-on-error: true
        run: |
          set +e
          npm run verify:vocabulary 2>&1 | tee /tmp/vocab.log
          code=${PIPESTATUS[0]}
          n=$(grep -oE '[0-9]+ vocabulary drift finding' /tmp/vocab.log | grep -oE '^[0-9]+' || echo 0)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      # A red step that does not fail the job stops being read, so the count goes
      # into the job summary where it cannot collapse into an unopened log.
      - name: Surface the accepted vocabulary debt
        if: always()
        run: |
          n='${{ steps.vocab.outputs.count }}'
          if [ "${{ steps.vocab.outputs.code }}" = "0" ]; then
            echo "### ✅ verify:vocabulary clean" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The drift debt is paid. **Remove \`continue-on-error\` from this step and delete this one** — release.yml should gate on it again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ ACCEPTED DEBT — verify:vocabulary is RED with $n finding(s)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Released deliberately with this red. All findings are **pre-existing dashboard-era names** in six stale docs (\`.chip\`, \`.input\`, \`.modal-positive\`, the \`.icon\` family) — **zero are \`va:\` prefix misses**, verified before accepting." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`ci.yml\` still gates on this and is red on every PR. When the drift commit lands, remove \`continue-on-error\` here." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '<details><summary>Full output</summary>' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/vocab.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '</details>' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: verify:markup
        run: npm run verify:markup

      # The real tarball in a real consumer Vite build, both entry points.
      - name: verify:package
        run: npm run verify:package

      # Publishing happens LOCALLY (see header). To re-enable CI publishing
      # after configuring the npmjs.com Trusted Publisher, replace this step
      # with:
      #   - name: publish
      #     run: npm publish --provenance
      - name: release verified (publish is local — see workflow header)
        run: echo "All release gates passed for ${GITHUB_REF_NAME}. Publish locally with npm publish."
