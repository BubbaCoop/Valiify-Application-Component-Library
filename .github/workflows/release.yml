# Tag-driven RELEASE VERIFICATION. Publishing is done LOCALLY (decision
# 2026-09-03): npm requires interactive 2FA for this account's writes, so
# CI publish needs the package's npmjs.com "Trusted Publisher" form filled
# in (owner BubbaCoop, repo Valiify-Application-Component-Library, workflow
# release.yml) — until someone does that one-time config, the local ritual
# is the release path:
#
#   # on a green, merged main:
#   <cut CHANGELOG [Unreleased] -> [x.y.z]>; git commit
#   npm version patch                      # bumps + tags
#   npm publish                            # browser 2FA prompt, local only
#   git push origin main --follow-tags     # triggers this verification
#   npm run restore-examples               # undo prepack's example rewrite
#
# This workflow gates every tag: version-match + fast gates + the packaging
# smoke test. TO RE-ENABLE CI PUBLISHING: fill in the Trusted Publisher
# form on npmjs.com, then restore the publish step documented at the bottom
# of this file.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v4

      # NO registry-url here: setup-node's registry-url writes an .npmrc
      # with _authToken=${NODE_AUTH_TOKEN}, which breaks token-less OIDC
      # publishing ("Failed to replace env in config"). Trusted publishing
      # needs a clean npm config.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm

      - run: npm ci

      - name: tag matches package.json version
        run: |
          set -euo pipefail
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json $PKG — bump the version before tagging."
            exit 1
          fi

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      - name: verify:layers
        run: npm run verify:layers

      - name: verify:bundle
        run: npm run verify:bundle

      # The real tarball in a real consumer Vite build, both entry points.
      - name: verify:package
        run: npm run verify:package

      # Publishing happens LOCALLY (see header). To re-enable CI publishing
      # after configuring the npmjs.com Trusted Publisher, replace this step
      # with:
      #   - name: publish
      #     run: npm publish --provenance
      - name: release verified (publish is local — see workflow header)
        run: echo "All release gates passed for ${GITHUB_REF_NAME}. Publish locally with npm publish."
